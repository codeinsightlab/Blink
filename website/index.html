<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#07090d" />
    <style>
      #root { visibility: hidden; }
      html.blink-ready #root { visibility: visible; }
    </style>
    <script>
      (() => {
        const root = document.documentElement;
        let saved = null;
        try {
          saved = window.localStorage.getItem("blink-language");
        } catch {}
        const language = saved === "zh" || saved === "en"
          ? saved
          : (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
        const platformSource = navigator.userAgentData?.platform || navigator.platform || navigator.userAgent || "";
        const platform = /Mac/i.test(platformSource) ? "macos" : /Win/i.test(platformSource) ? "windows" : "other";
        root.dataset.locale = language;
        root.dataset.platform = platform;
        root.lang = language === "en" ? "en" : "zh-CN";
      })();
    </script>
    <title>Blink - 把任意按键变成快捷动作</title>
    <meta
      name="description"
      content="Blink 是一款桌面快捷控制工具，将 App、URL、脚本和系统动作绑定到实体按键，一键启动、切换和执行。"
    />
    <link rel="icon" type="image/svg+xml" href="/blink.svg" />
    <!-- seo:generated -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
