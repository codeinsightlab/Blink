name: Build and publish Blink release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  RUST_BACKTRACE: "1"

jobs:
  build-macos-arm64:
    name: Build macOS arm64 DMG
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out private source tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Runtime dependencies
        working-directory: runtime
        run: npm ci

      - name: Build production DMG
        working-directory: runtime
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles dmg

      - name: Verify DMG and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(runtime/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#files[@]}" -eq 1
          file "${files[0]}"
          hdiutil verify "${files[0]}"
          shasum -a 256 "${files[0]}" | tee macos-checksums.txt
          printf 'macOS release asset: %s\n' "$(basename "${files[0]}")"

      - name: Stage macOS release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets-macos
          cp runtime/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release-assets-macos/
          cp macos-checksums.txt release-assets-macos/

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blink-release-macos-arm64
          path: release-assets-macos/
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows x64 installers
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out private source tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Runtime dependencies
        working-directory: runtime
        run: npm ci

      - name: Build production NSIS and MSI installers
        working-directory: runtime
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Verify installers and calculate SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            Get-ChildItem 'runtime/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue
            Get-ChildItem 'runtime/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi' -Filter '*.msi' -File -ErrorAction SilentlyContinue
          )
          if ($files.Count -lt 1) { throw 'No Windows production installer was generated.' }
          New-Item -ItemType Directory -Force 'release-assets-windows' | Out-Null
          $checksumLines = foreach ($file in $files) {
            Copy-Item $file.FullName 'release-assets-windows/'
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "Windows release asset: $($file.Name)"
            "$hash  $($file.Name)"
          }
          $checksumLines | Set-Content -Encoding utf8 'release-assets-windows/windows-checksums.txt'
          $checksumLines | Write-Host

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blink-release-windows-x64
          path: release-assets-windows/
          if-no-files-found: error

  publish-public-release:
    name: Publish binaries to Blink-Releases
    needs:
      - build-macos-arm64
      - build-windows-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: blink-release-*
          path: release-assets
          merge-multiple: true

      - name: Assemble release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print | sort)
          test "${#assets[@]}" -ge 2
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' \) | wc -l)" -ge 1
          (
            cd release-assets
            find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > release-assets/checksums.txt
          cat release-assets/checksums.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Blink v0.1.0

          Blink 首个公开测试版本。

          ### macOS

          - Apple Silicon / arm64
          - DMG
          - 当前为 unsigned / non-notarized 测试构建，macOS 可能显示安全警告

          ### Windows

          - x64
          - Production installer

          ### 当前能力

          - 全局快捷键 / 外接键盘绑定
          - 打开与快速切换应用
          - 发送快捷键
          - 打开网址、文件和文件夹
          - 执行脚本
          - Profile 导入与本地绑定
          - Windows / macOS Runtime

          这是早期测试版本。不同应用、多窗口场景以及不同系统环境仍可能存在兼容性差异。

          This repository contains public Blink release binaries only.
          The Blink source repository is private.
          EOF

      - name: Refuse to overwrite an existing public release
        env:
          GH_TOKEN: ${{ secrets.BLINK_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          if gh release view "${GITHUB_REF_NAME}" --repo codeinsightlab/Blink-Releases >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists in codeinsightlab/Blink-Releases; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Create public binary release
        env:
          GH_TOKEN: ${{ secrets.BLINK_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print | sort)
          assets+=("release-assets/checksums.txt")
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo codeinsightlab/Blink-Releases \
            --target main \
            --title "Blink ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
