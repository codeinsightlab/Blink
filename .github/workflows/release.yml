name: Build and publish Blink release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        default: v0.1.0

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  RUST_BACKTRACE: "1"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  preflight:
    name: Verify release tag and publishing credential
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify checked-out source identity
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          tag_target="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          printf 'release tag: %s\ncheckout HEAD: %s\ntag target: %s\n' "${RELEASE_TAG}" "${actual_head}" "${tag_target}"
          test "${actual_head}" = "${tag_target}"
          if [[ "${RELEASE_TAG}" = "v0.1.0" ]]; then
            test "${actual_head}" = "53fa73c05a3ef41e4d9f3e75028a29a8ab63f6b6"
          fi

      - name: Require cross-repository release token
        env:
          RELEASE_TOKEN: ${{ secrets.BLINK_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RELEASE_TOKEN:-}"

  verify:
    needs: preflight
    uses: ./.github/workflows/verify.yml
    with:
      source_ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

  build-macos-arm64:
    name: Build macOS arm64 DMG
    needs: [preflight, verify]
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out private source tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify checked-out source identity
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          tag_target="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          printf 'release tag: %s\ncheckout HEAD: %s\ntag target: %s\n' "${RELEASE_TAG}" "${actual_head}" "${tag_target}"
          test "${actual_head}" = "${tag_target}"
          if [[ "${RELEASE_TAG}" = "v0.1.0" ]]; then
            test "${actual_head}" = "53fa73c05a3ef41e4d9f3e75028a29a8ab63f6b6"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install root workspace dependencies
        run: npm ci

      - name: Validate shared contract and Studio TypeScript
        run: npm run typecheck

      - name: Install independent Runtime dependencies
        working-directory: runtime
        run: npm ci

      - name: Build production DMG
        working-directory: runtime
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles dmg

      - name: Verify DMG and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(runtime/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#files[@]}" -eq 1
          file "${files[0]}"
          hdiutil verify "${files[0]}"
          shasum -a 256 "${files[0]}" | tee macos-checksums.txt
          printf 'macOS release asset: %s\n' "$(basename "${files[0]}")"

      - name: Stage macOS release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets-macos
          cp runtime/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release-assets-macos/
          cp macos-checksums.txt release-assets-macos/

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blink-release-macos-arm64
          path: release-assets-macos/
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows x64 installers
    needs: [preflight, verify]
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out private source tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify checked-out source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualHead = (git rev-parse HEAD).Trim()
          $tagTarget = (git rev-list -n 1 "refs/tags/$env:RELEASE_TAG").Trim()
          Write-Host "release tag: $env:RELEASE_TAG"
          Write-Host "checkout HEAD: $actualHead"
          Write-Host "tag target: $tagTarget"
          if ($actualHead -ne $tagTarget) { throw 'Checked-out HEAD does not match the release tag target.' }
          if ($env:RELEASE_TAG -eq 'v0.1.0' -and $actualHead -ne '53fa73c05a3ef41e4d9f3e75028a29a8ab63f6b6') {
            throw 'v0.1.0 does not point to the immutable expected release commit.'
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install root workspace dependencies
        run: npm ci

      - name: Validate shared contract and Studio TypeScript
        run: npm run typecheck

      - name: Install independent Runtime dependencies
        working-directory: runtime
        run: npm ci

      - name: Build production NSIS and MSI installers
        working-directory: runtime
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Verify installers and calculate SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            Get-ChildItem 'runtime/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue
            Get-ChildItem 'runtime/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi' -Filter '*.msi' -File -ErrorAction SilentlyContinue
          )
          if ($files.Count -lt 1) { throw 'No Windows production installer was generated.' }
          New-Item -ItemType Directory -Force 'release-assets-windows' | Out-Null
          $checksumLines = foreach ($file in $files) {
            Copy-Item $file.FullName 'release-assets-windows/'
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "Windows release asset: $($file.Name)"
            "$hash  $($file.Name)"
          }
          $checksumLines | Set-Content -Encoding utf8 'release-assets-windows/windows-checksums.txt'
          $checksumLines | Write-Host

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blink-release-windows-x64
          path: release-assets-windows/
          if-no-files-found: error

  publish-public-release:
    name: Publish binaries to Blink-Releases
    needs:
      - build-macos-arm64
      - build-windows-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: blink-release-*
          path: release-assets
          merge-multiple: true

      - name: Assemble release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print | sort)
          test "${#assets[@]}" -ge 2
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' \) | wc -l)" -ge 1
          (
            cd release-assets
            find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > release-assets/checksums.txt
          cat release-assets/checksums.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Blink v0.1.0

          Blink 首个公开测试版本。

          ### macOS

          - Apple Silicon / arm64
          - DMG
          - 当前为 unsigned / non-notarized 测试构建，macOS 可能显示安全警告

          ### Windows

          - x64
          - Production installer

          ### 当前能力

          - 全局快捷键 / 外接键盘绑定
          - 打开与快速切换应用
          - 发送快捷键
          - 打开网址、文件和文件夹
          - 执行脚本
          - Profile 导入与本地绑定
          - Windows / macOS Runtime

          这是早期测试版本。不同应用、多窗口场景以及不同系统环境仍可能存在兼容性差异。

          This repository contains public Blink release binaries only.
          The Blink source repository is private.
          EOF

      - name: Refuse to overwrite an existing public release
        env:
          GH_TOKEN: ${{ secrets.BLINK_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          if gh release view "${RELEASE_TAG}" --repo codeinsightlab/Blink-Releases >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists in codeinsightlab/Blink-Releases; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Create public binary release
        env:
          GH_TOKEN: ${{ secrets.BLINK_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print | sort)
          assets+=("release-assets/checksums.txt")
          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --repo codeinsightlab/Blink-Releases \
            --target main \
            --title "Blink ${RELEASE_TAG}" \
            --notes-file release-notes.md
